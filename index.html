<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10264a"><title>A股量化助手</title>
<style>
:root{--blue:#2463eb;--navy:#10264a;--bg:#f3f5fa;--ink:#172033;--muted:#77839a;--line:#e5eaf2;--red:#df5360;--green:#159b73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,#10264a,#174477);color:white;padding:26px 20px 22px;border-radius:0 0 24px 24px}
h1{font-size:23px;margin:0 0 7px}.muted{color:var(--muted)}header .muted{color:#c2d2e9;font-size:13px}
.wrap{max-width:850px;margin:auto;padding:18px 14px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.status{font-size:11px;border:1px solid #ffffff55;border-radius:30px;padding:6px 10px;color:#dceaff}
.search{width:100%;margin-top:18px;padding:15px;border:1px solid #ffffff30;border-radius:13px;background:#ffffff20;color:white;font-size:15px}.search::placeholder{color:#d2dced}
.section{font-size:18px;font-weight:750;margin:22px 2px 12px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 5px 18px #1b31500a}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,button{border:1px solid var(--line);background:white;color:#68758a;border-radius:25px;padding:9px 13px;font-size:13px}.tab.active,button.primary{background:var(--blue);border-color:var(--blue);color:white}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.filters label{font-size:12px;color:#68758a}.filters input{width:100%;margin-top:7px;padding:11px;border:1px solid var(--line);border-radius:11px;font-size:15px}
.action{width:100%;margin-top:14px;padding:14px;border:0;border-radius:13px;background:var(--blue);color:white;font-weight:700;font-size:16px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:10px 2px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:12px 5px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500}td:first-child{font-weight:700}td small{display:block;color:var(--muted);font-weight:400;margin-top:4px}.up{color:var(--red)}.down{color:var(--green)}
.notice{font-size:12px;line-height:1.65;color:#8b6a27;background:#fff9e9;border:1px solid #f5e7bd;border-radius:12px;padding:12px}
.error{font-size:13px;color:#a33;background:#fff1f1;padding:12px;border-radius:12px;line-height:1.6}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:12px 4px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
nav span{font-size:11px;color:#7c879b;text-align:center}nav b{display:block;font-size:17px;margin-bottom:3px}
@media(max-width:390px){table{font-size:12px}td,th{padding:10px 3px}.filters{gap:8px}}
</style></head>
<body>
<header><div class="topline"><div><h1>📈 A股量化助手</h1><div class="muted">沪深北全市场 · 盘中行情扫描</div></div><span class="status" id="status">正在连接数据服务</span></div>
<input class="search" id="search" placeholder="搜索股票代码 / 名称"></header>
<main class="wrap">
<div class="section">量化选股</div>
<div class="card">
<div class="tabs"><button class="tab active" data-mode="trend">综合趋势</button><button class="tab" data-mode="volume">放量突破</button><button class="tab" data-mode="pullback">回调观察</button></div>
<div class="filters"><label>最低综合评分<input id="minScore" type="number" min="0" max="100" value="60"></label><label>涨跌幅下限 (%)<input id="minChange" type="number" step=".1" value="-2"></label><label>涨跌幅上限 (%)<input id="maxChange" type="number" step=".1" value="8"></label><label>最低成交额（万元）<input id="minAmount" type="number" value="3000"></label></div>
<button class="action" id="scan">开始扫描全市场</button>
<div class="meta"><span id="updated">尚未获取行情</span><span id="count">0 只候选</span></div>
<div id="message"></div>
</div>
<div class="section">筛选结果</div>
<div class="card" style="overflow:auto"><table><thead><tr><th>股票</th><th>现价</th><th>涨跌幅</th><th>成交额</th><th>评分</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">请先连接后台行情服务</td></tr></tbody></table></div>
<div class="notice">数据说明：本版本通过后台数据源获取沪深京A股快照。免费数据源可能存在延迟、限流或中断，不等同于交易所授权实时行情。评分为规则计算结果，不构成投资建议；本工具不会自动下单。</div>
</main>
<nav><span><b>⌂</b>首页</span><span><b>⌕</b>选股</span><span><b>▥</b>行情</span><span><b>◷</b>回测</span><span><b>♙</b>我的</span></nav>
<script>
const API_BASE = localStorage.getItem('ASHARE_API_BASE') || 'https://YOUR-BACKEND-URL.onrender.com';
let allRows=[], mode='trend';
const $=id=>document.getElementById(id);
function pct(v){return Number(v||0).toFixed(2)+'%'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function score(s){
 let ch=Number(s.change_pct||0),vr=Number(s.volume_ratio||0),turn=Number(s.turnover_rate||0);
 let v=45+Math.max(-15,Math.min(20,ch*3))+Math.max(0,Math.min(15,(vr-1)*8))+Math.max(0,Math.min(10,turn));
 if(ch<0) v-=8; return Math.round(Math.max(0,Math.min(100,v)));
}
function selected(){
 let q=$('search').value.trim().toLowerCase(),min=+$('minScore').value||0,lo=+$('minChange').value,hi=+$('maxChange').value,amt=(+$('minAmount').value||0)*10000;
 return allRows.map(s=>({...s,score:score(s)})).filter(s=>(!q||s.code.toLowerCase().includes(q)||s.name.toLowerCase().includes(q))&&s.score>=min&&s.change_pct>=lo&&s.change_pct<=hi&&s.amount>=amt)
 .filter(s=>mode!=='volume'||s.volume_ratio>=1.5).filter(s=>mode!=='pullback'||(s.change_pct>-3&&s.change_pct<2))
 .sort((a,b)=>b.score-a.score);
}
function render(){
 let data=selected();$('count').textContent=data.length+' 只候选';
 $('rows').innerHTML=data.slice(0,300).map(s=>`<tr><td>${esc(s.name)}<small>${esc(s.code)} ${s.market||''}</small></td><td>${Number(s.price||0).toFixed(2)}</td><td class="${s.change_pct>=0?'up':'down'}">${s.change_pct>=0?'+':''}${pct(s.change_pct)}</td><td>${(Number(s.amount||0)/10000).toFixed(0)}万</td><td><b>${s.score}</b></td></tr>`).join('')||'<tr><td colspan="5" class="muted">没有符合条件的股票，可调整筛选参数</td></tr>';
}
async function refresh(){
 $('status').textContent='获取行情中';$('message').innerHTML='';
 try{
  const r=await fetch(API_BASE.replace(/\/$/,'')+'/api/stocks',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
  const j=await r.json();if(!j.items)throw Error(j.detail||'数据格式异常');
  allRows=j.items;$('status').textContent='数据已连接';$('updated').textContent='数据时间：'+(j.updated_at||'未知')+' · '+(j.source||'行情源');
  $('message').innerHTML=j.warning?`<div class="notice">${esc(j.warning)}</div>`:'';render();
 }catch(e){$('status').textContent='未连接';$('message').innerHTML=`<div class="error">尚未连接后台行情服务：${esc(e.message)}。请先部署 backend，并将本页 API_BASE 改成后台地址。当前不会显示虚构行情。</div>`;$('rows').innerHTML='<tr><td colspan="5" class="muted">暂无真实行情数据</td></tr>'}
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()}));
['search','minScore','minChange','maxChange','minAmount'].forEach(id=>$(id).addEventListener('input',render));
$('scan').addEventListener('click',refresh);
refresh();setInterval(refresh,15000);
</script></body></html>
